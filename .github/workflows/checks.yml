name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      # Full Cargo checks require the currently unpublished Actorpass sibling.
      # Keep this required check honest and hermetic until Actorpass is
      # available through an immutable remote source; local pre-commit checks
      # still run the complete workspace against sibling checkouts.
      - name: Evaluate Nix flake
        run: nix flake check --no-build
