name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Nix Flake Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Nix
        uses: nixbuild/nix-quick-install-action@v30
        with:
          nix_conf: |
            experimental-features = nix-command flakes
            accept-flake-config = true
      # Full output evaluation currently requires both the unpublished
      # Actorpass sibling and a remotely reproducible Rust 1.96 Fenix
      # derivation. Validate the locked flake inputs here without overstating
      # coverage; local pre-commit checks run the complete sibling workspace.
      - name: Validate locked Nix inputs
        run: nix flake metadata --no-update-lock-file
