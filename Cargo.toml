[workspace]
members = ["crates/core", "crates/actorpass", "crates/tower"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/mnesis-bombay"

[workspace.dependencies]
actorpass = { path = "../actorpass/crates/actorpass" }
behavior = { package = "bombay-behavior", version = "0.8.0" }
bytes = "1"
mnesis = "0.2.0"
mnesis-store = "0.2.0"
mnesis-inmemory = "0.2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[package]
name = "mnesis-bombay-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
actorpass.workspace = true
behavior.workspace = true
bytes.workspace = true
mnesis.workspace = true
mnesis-store = { workspace = true, features = ["json", "serde", "subscription"] }
mnesis-inmemory.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true

[patch.crates-io]
bombay-behavior = { path = "../behaviorpass/crates/behavior" }
bombay-behavior-macros = { path = "../behaviorpass/crates/behavior-macros" }
mnesis = { path = "../nexus/crates/mnesis" }
mnesis-store = { path = "../nexus/crates/store" }
mnesis-inmemory = { path = "../nexus/adapters/inmemory" }

[[bench]]
name = "architecture_comparison"
harness = false
