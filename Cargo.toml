[workspace]
members = ["crates/core", "crates/execution", "crates/bombay", "crates/tower"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.96.0"
license = "MIT OR Apache-2.0"
authors = ["Joel DSouza <joel@devrandom.co>"]
repository = "https://github.com/devrandom-labs/mnesis-bombay"

[workspace.dependencies]
behavior = { package = "bombay-behavior", version = "0.9.5" }
bombay = { package = "bombay-rs", version = "0.1.0" }
bombay-entity = "0.1.0"
bytes = "1"
mnesis = { version = "0.3.1", default-features = false }
mnesis-bombay-execution = { version = "0.2.0", path = "crates/execution" }
mnesis-inmemory = "0.3.1"
mnesis-store = "0.3.1"
parking_lot = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-service = "0.3"
trybuild = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[package]
name = "mnesis-bombay-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
behavior.workspace = true
bombay.workspace = true
bombay-entity.workspace = true
bytes.workspace = true
mnesis.workspace = true
mnesis-inmemory.workspace = true
mnesis-store = { workspace = true, features = ["json", "serde", "subscription"] }
parking_lot.workspace = true
tokio = { workspace = true, features = ["full"] }
tower.workspace = true

[[bench]]
name = "architecture_comparison"
harness = false
